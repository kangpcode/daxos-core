[application]
icon = "icon.svg"
bundle_identifier = "org.daxos.calculator"
display_name = "DAXOS Pro Calculator"
version = "1.0.0"
build_number = 1
minimum_os_version = "1.0.0"

[developer]
id = "dev-daxos-core"
legal_name = "DAXOS Core Engineering Group"

[sandbox]
enforce = true
network_isolation = "strict"

[permissions]
required = [
    "daxos.permission.GPU_ACCELERATION"
]
optional = []

[resources]
max_memory_mb = 128
max_cpu_percent = 50
max_file_descriptors = 512

[landlock_paths]
read_write = [
    "~/Library/Containers/org.daxos.calculator/Data"
]
read_only = [
    "/usr/share/fonts"
]
