[application]
icon = "icon.svg"
bundle_identifier = "org.daxos.dapstore"
display_name = "DapStore"
version = "1.0.0"
build_number = 1
minimum_os_version = "1.0.0"

[developer]
id = "dev-daxos-core"
legal_name = "DAXOS Core Engineering Group"

[sandbox]
enforce = true
network_isolation = "standard"

[permissions]
required = [
    "daxos.permission.NETWORK_SOCKET",
    "daxos.permission.PACKAGE_INSTALL",
    "daxos.permission.GPU_ACCELERATION"
]
optional = []

[resources]
max_memory_mb = 1024
max_cpu_percent = 70
max_file_descriptors = 2048

[landlock_paths]
read_write = [
    "~/Library/Containers/org.daxos.store/Data",
    "/tmp"
]
read_only = [
    "/usr/share/fonts"
]
