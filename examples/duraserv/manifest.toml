[application]
icon = "icon.svg"
bundle_identifier = "org.daxos.duraserv"
display_name = "DuraServ Web Server & Developer Stack"
version = "1.10.2026"
build_number = 1
minimum_os_version = "1.0.0"

[developer]
id = "dev-daxos-core"
legal_name = "DAXOS Core Engineering Group"

[sandbox]
enforce = true
network_isolation = "standard"

[permissions]
required = [
    "daxos.permission.NETWORK_SERVER",
    "daxos.permission.FILE_SYSTEM_VAR_WWW"
]
optional = [
    "daxos.permission.GPU_ACCELERATION"
]

[resources]
max_memory_mb = 1024
max_cpu_percent = 90
max_file_descriptors = 4096

[landlock_paths]
read_write = [
    "/var/www/html",
    "~/Sites",
    "/var/lib/duraserv"
]
read_only = [
    "/etc/duraserv",
    "/usr/share/fonts"
]
