[package]
name = "dap-sandboxd"
version = "0.1.0"
edition = "2021"

[dependencies]
dcodx-bundle = { path = "../dcodx-bundle" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
rand = "0.8"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "rand_core"] }
