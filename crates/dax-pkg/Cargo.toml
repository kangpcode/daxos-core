[package]
name = "dax-pkg"
version = "1.10.2026"
edition = "2021"
description = "DAXOS Native Package Manager — installs, removes, upgrades, and audits .dapp packages"

[[bin]]
name = "dax"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
sha3 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "rand_core"] }
rand = "0.8"
flate2 = "1.0"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dap-registryd = { path = "../dap-registryd" }
dap-sandboxd = { path = "../dap-sandboxd" }
dcodx-bundle = { path = "../dcodx-bundle" }
