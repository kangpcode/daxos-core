[package]
name = "dax-installer"
version = "1.10.2026"
edition = "2021"
description = "DAXOS Production OS Installer — GPT partitioning, EFI boot, A/B dual slot, user setup"

[[bin]]
name = "dax-installer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
