[package]
name = "dax-clock"
version = "1.10.2026"
edition = "2021"
authors = ["Dhafa Nazula Permadi <kangpcode>"]
description = "DAXOS Clock, World Time, Alarm, Stopwatch & Timer Suite"

[[bin]]
name = "dclock"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

