[package]
name = "dap-compat"
version = "1.10.2026"
edition = "2021"
authors = ["Dhafa Nazula Permadi <kangpcode>"]
description = "DAXOS Universal Application Runtime Subsystem (Windows, macOS, Debian, Ubuntu)"

[[bin]]
name = "dax-run"
path = "src/main.rs"

[[bin]]
name = "dax-trans"
path = "src/bin/dax_trans.rs"

[dependencies]
drex-ui = { path = "../drex-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
