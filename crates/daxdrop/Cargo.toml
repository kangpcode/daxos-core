[package]
name = "daxdrop"
version = "1.10.2026"
edition = "2021"
description = "DAXOS DaXDrop Peer-to-Peer Transfer & Vision Air-Gesture Engine"

[[bin]]
name = "daxdrop"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
rand = "0.8"
drex-ui = { path = "../drex-ui" }
