[package]
name = "dax-files"
version = "1.10.2026"
edition = "2021"
description = "DAXOS File Manager CLI & VFS Browser (Finder / Explorer Equivalent)"

[[bin]]
name = "dfm"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
