[package]
name = "dax-netd"
version = "1.10.2026"
edition = "2021"
description = "DAXOS Network Manager Daemon & dnet Network Configuration Engine"

[[bin]]
name = "dnet"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
