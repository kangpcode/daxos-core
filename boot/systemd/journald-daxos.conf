# ==============================================================================
# DAXOS SYSTEMD-JOURNALD HIGH-PERFORMANCE CONFIGURATION
# File: boot/systemd/journald-daxos.conf
# ==============================================================================
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SplitMode=uid
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=10000
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=128M
RuntimeMaxUse=256M
RuntimeKeepFree=512M
RuntimeMaxFileSize=32M
MaxRetentionSec=1month
MaxFileSec=1week
ForwardToSyslog=no
ForwardToKMsg=yes
ForwardToConsole=no
ForwardToWall=no
TTYPath=/dev/tty1
LineMax=48K
