# ==============================================================================
# DAXOS BOOTLOADER ORCHESTRATION CONFIGURATION (GRUB 2.12)
# File: boot/grub/grub.cfg
# ==============================================================================

set default=0
set timeout=2

# Load persistent environment variables from metadata partition (GPT partition 6)
load_env -f (hd0,gpt6)/grubenv

# Initialize default variables if environment is uninitialized
if [ -z "${slot_active}" ]; then
    set slot_active="A"
fi
if [ -z "${slot_pending}" ]; then
    set slot_pending="none"
fi
if [ -z "${boot_counter}" ]; then
    set boot_counter=0
fi

# ------------------------------------------------------------------------------
# AUTOMATIC ROLLBACK EVALUATION LOGIC
# ------------------------------------------------------------------------------

if [ "${slot_pending}" != "none" ]; then
    set current_boot_slot="${slot_pending}"
else
    set current_boot_slot="${slot_active}"
fi

# If boot failures reach threshold (3), perform automatic fallback
if [ ${boot_counter} -ge 3 ]; then
    echo "ALERT: Boot failure threshold reached for slot ${current_boot_slot}!"
    echo "Initiating automatic rollback to stable slot..."
    if [ "${current_boot_slot}" = "A" ]; then
        set slot_active="B"
    else
        set slot_active="A"
    fi
    set slot_pending="none"
    set boot_counter=0
    set current_boot_slot="${slot_active}"
    save_env -f (hd0,gpt6)/grubenv slot_active slot_pending boot_counter
fi

# Increment boot counter prior to booting kernel
expr_eval "${boot_counter} + 1" boot_counter
save_env -f (hd0,gpt6)/grubenv boot_counter

# ------------------------------------------------------------------------------
# BOOT MENU ENTRIES
# ------------------------------------------------------------------------------

menuentry "DAXOS Modern Hybrid OS (Slot ${current_boot_slot})" {
    insmod ext2
    insmod gzio
    insmod part_gpt

    if [ "${current_boot_slot}" = "A" ]; then
        set root=(hd0,gpt2)
        set root_part_uuid="4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709"
        set verity_hash_root="b3f5c719e83610928a41753cfa9e39b207a618d3b854ec7a6f2098d89a42be7c"
        linux /vmlinuz-daxos root=/dev/dm-0 ro quiet splash daxos.slot=A dm-mod.create="daxos-root,,,ro,0 16777216 verity 1 /dev/disk/by-partlabel/DAXOS_ROOT_A /dev/disk/by-partlabel/DAXOS_ROOT_A 4096 4096 2097152 2097152 sha256 ${verity_hash_root} none"
        initrd /initramfs-daxos.img
    else
        set root=(hd0,gpt3)
        set root_part_uuid="4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709"
        set verity_hash_root="e1c8491035acdb8271fe5923ba61c2847d0e1948ba265a7f9c31405e6b72a9df"
        linux /vmlinuz-daxos root=/dev/dm-0 ro quiet splash daxos.slot=B dm-mod.create="daxos-root,,,ro,0 16777216 verity 1 /dev/disk/by-partlabel/DAXOS_ROOT_B /dev/disk/by-partlabel/DAXOS_ROOT_B 4096 4096 2097152 2097152 sha256 ${verity_hash_root} none"
        initrd /initramfs-daxos.img
    fi
}

menuentry "DAXOS Safe Graphics / Nomodeset (VESA Fallback 60Hz)" {
    insmod ext2
    insmod gzio
    insmod part_gpt
    set root=(hd0,gpt2)
    linux /vmlinuz-daxos root=/dev/dm-0 ro nomodeset vga=current daxos.driver=vesa_legacy daxos.slot=A
    initrd /initramfs-daxos.img
}

menuentry "DAXOS Setup Assistant & Bare-Metal Installer" {
    insmod ext2
    insmod gzio
    insmod part_gpt
    set root=(hd0,gpt2)
    linux /vmlinuz-daxos root=/dev/dm-0 ro quiet splash daxos.autoinstall=0 daxos.mode=installer
    initrd /initramfs-daxos.img
}

menuentry "DAXOS Recovery Mode & Hardware Diagnostic Shell" {
    insmod ext2
    insmod gzio
    insmod part_gpt
    set root=(hd0,gpt2)
    linux /vmlinuz-daxos root=/dev/dm-0 ro single rescue daxos.mode=recovery
    initrd /initramfs-daxos.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI Firmware Settings" {
        fwsetup
    }
fi

