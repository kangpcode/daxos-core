# ==============================================================================
# DAXOS KERNEL SYSCTL PERFORMANCE & HARDENING TUNING
# File: boot/sysctl.d/99-daxos-hardened.conf
# ==============================================================================

# File Descriptor and Inotify limits for modern IDEs and Workstations
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Virtual Memory: optimized for Proton, Wine, Vulkan, and NTSync gaming
vm.max_map_count = 2147483642
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# TCP/IP Networking: Google BBRv3 congestion control with FQ pacer
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Kernel Security Hardening & Root-of-Trust
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.yama.ptrace_scope = 1
kernel.sysrq = 0
