# ==============================================================================
# DAXOS Desktop Wallpaper Configuration
# Path: /etc/daxos/wallpaper.conf & boot/wallpaper.conf
# Used by: DreXUI, drex-compositor, and daxos-wallpaper-manager.sh
# ==============================================================================

[current]
theme = "acrylic"
name = "Liquid Acrylic (Default)"
mode = "cover"
ambient_glow = true
blur_radius = 48
caustic_refraction = true

[presets.acrylic]
name = "Liquid Acrylic"
type = "gradient"
description = "DAXOS 240Hz Multi-Radial Gradient Aurora dengan shader refraksi kaca Dual-Kawase"

[presets.obsidian]
name = "Obsidian AMOLED"
type = "gradient"
description = "Paling hemat daya untuk panel OLED dengan pitch black murni dan deep indigo aura"

[presets.cyberpunk]
name = "Cyberpunk Sunset"
type = "gradient"
description = "Semburat neon crimson dan electric violet berenergi tinggi untuk gaming dan kreativitas"

[presets.emerald]
name = "Emerald Matrix"
type = "gradient"
description = "Nuansa hutan digital dengan kombinasi mint, forest teal, dan cyan coding environment"

[presets.nebula]
name = "Deep Space Nebula"
type = "gradient"
description = "Atmosfer kosmik violet gelap, partikel bintang pendar, dan kedalaman luar angkasa tak terhingga"

[presets.sunrise]
name = "Pacific Sunrise"
type = "gradient"
description = "Kehangatan fajar samudra pasifik dengan paduan koral lembut, jingga emas, dan amber"

[presets.glacier]
name = "Nordic Glacier Frost"
type = "gradient"
description = "Kesejukan kristal es Nordik, putih alpine jernih, dan biru baja minimalis elegan"

[presets.tokyo]
name = "Tokyo Midnight Rain"
type = "gradient"
description = "Pantulan lampu neon kota megapolitan di atas aspal basah dan langit malam gerimis"

[presets.gold]
name = "Rhino Platinum Gold"
type = "gradient"
description = "Edisi eksklusif DAXOS Rhino dengan aksen platinum cair, titanium murni, dan emas kuarsa"
